# ============================================================================
# GitHub Actions 工作流：构建静态产物 → 触发 EdgeOne 边缘部署
#
# 整体流程：
#   1) 在 GitHub 临时虚拟机上 npm ci / build，产出 dist/ 静态站点
#   2) 跑基础单元测试，失败则中断，不触发部署
#   3) 通过 GitHub Secret 中的「EdgeOne 部署钩子地址」POST 触发边缘部署
#
# 需要在仓库 Settings → Secrets and variables → Actions → Secrets 里预置：
#   EDGEONE_DEPLOY_HOOK   EdgeOne 边缘部署 / Pages 项目的 Deploy Hook URL
#                         （该 URL 本身已带鉴权，POST 即触发，无需额外 token）
#
# 回退：旧 Docker + 自建服务器流水线存档在 .github/backups/deploy.docker.yml，
#       复制回 .github/workflows/deploy.yml 即可恢复。
# ============================================================================

name: Deploy (EdgeOne)

# ---------------------------------------------------------------------------
# on：什么事件触发
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]
  workflow_dispatch:

# ---------------------------------------------------------------------------
# concurrency：同一分支部署串行，避免并发覆盖
# ---------------------------------------------------------------------------
concurrency:
  group: edgeone-deploy-${{ github.ref }}
  cancel-in-progress: false

# ---------------------------------------------------------------------------
# permissions：最小权限，仅读代码
# ---------------------------------------------------------------------------
permissions:
  contents: read

# ---------------------------------------------------------------------------
# jobs
# ---------------------------------------------------------------------------
jobs:
  build-and-deploy:
    name: Build & Trigger EdgeOne
    runs-on: ubuntu-latest
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建产物
        run: npm run build

      - name: 单元测试
        run: node tests/basic.test.mjs

      - name: 触发 EdgeOne 边缘部署
        env:
          EDGEONE_DEPLOY_HOOK: ${{ secrets.EDGEONE_DEPLOY_HOOK }}
        run: |
          if [ -z "$EDGEONE_DEPLOY_HOOK" ]; then
            echo "::error::未配置 Secret EDGEONE_DEPLOY_HOOK，跳过部署"
            exit 1
          fi
          echo "正在触发 EdgeOne 边缘部署…"
          # 捕获响应体，并在末尾追加 HTTP 状态码，便于回显与判断成功与否
          resp=$(curl -s -w '\n%{http_code}' -X POST "$EDGEONE_DEPLOY_HOOK")
          http_code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          echo "EdgeOne 返回（HTTP $http_code）："
          echo "$body"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::部署钩子返回非 2xx 状态码：$http_code"
            exit 1
          fi
          echo "EdgeOne 边缘部署已触发"
