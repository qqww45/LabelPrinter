  <title>页面未找到｜签立方</title>

    :root {
      --text: #0f172a;

      --border: rgba(15, 23, 42, 0.12);
      --bg: #f8fafc;

      font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
      margin-bottom: 2rem;
    }
    h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin: 0 0 1rem; line-height: 1.25; }
    p { color: var(--text-muted); line-height: 1.6; }
    nav { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem; }
    nav a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    nav a:hover { text-decoration: underline; }
    hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0 0; }

</head>
