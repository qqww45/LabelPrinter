name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: '回滚到的镜像 tag（留空 = latest）'
        required: false
        default: ''

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建产物
        run: npm run build

      - name: 单元测试
        run: node tests/basic.test.mjs

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # 推送镜像固定用仓库内置 GITHUB_TOKEN（jobs 级 packages:write 已授权）
          # 服务器拉取用的是 read-only PAT（GHCR_TOKEN），已存在服务器 /home/ubuntu/label-printer/.ghcr_token
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v3

      - name: 计算镜像元数据
        id: meta
        run: |
          echo "image=ghcr.io/${{ github.repository_owner }}/label-printer" >> $GITHUB_OUTPUT
          echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: 构建并推送
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 加载 SSH 私钥
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: 部署到服务器
        env:
          HOST: ${{ secrets.SERVER_HOST }}
          USER: ${{ secrets.SERVER_USER }}
          TAG: ${{ inputs.tag || needs.build.outputs.tag }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -o ServerAliveInterval=30 \
              ${USER}@${HOST} \
              "TAG='${TAG}' /home/ubuntu/label-printer/restart.sh"
