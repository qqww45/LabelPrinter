server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback：所有未匹配路径回 index.html（vue-router 等）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 长期缓存带 hash 的构建产物
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 禁止索引
    location = /robots.txt { access_log off; log_not_found off; }
}
